[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "swayprofile"
dynamic = ["version"]
description = "Switch sway power/performance profiles (refresh rates, power-profiles-daemon, GPU via LACT, DND) manually, per window, or on idle"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["i3ipc"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment :: Window Managers",
]

[project.optional-dependencies]
# Needed for power-profiles-daemon switching. Builds from source (needs a compiler
# and dbus/glib headers); prefer the distro package with `pipx --system-site-packages`.
power = ["dbus-python"]

[project.urls]
Homepage = "https://github.com/Syphdias/swayprofile"

[project.scripts]
swayprofile = "swayprofile.cli:main"

[tool.hatch.version]
source = "vcs"

# Dev: `uvx ruff check . && uvx ruff format --check . && uvx pytest`

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ASYNC", "RUF"]
ignore = [
    "RUF001",  # ambiguous unicode in strings (nerd font icons, "·")
    "ASYNC240",  # blocking pathlib calls: only tiny tmpfs/sysfs files here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
